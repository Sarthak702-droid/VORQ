<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">VORQ</title>
  <desc id="d">BOQ to final bill, on one record. An arch is laid stone by stone and locked by a red keystone.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .36  0 0 0 0 .28  0 0 0 0 .15  0 0 0 .1 0"/>
    </filter>
    <style>
      .serif { font-family: 'Libre Caslon Text','Libre Caslon Display','Big Caslon','Hoefler Text',Georgia,'Times New Roman',serif; }
      .label { font: 600 14px Inter,'Helvetica Neue',Helvetica,Arial,sans-serif; letter-spacing: 3.2px; fill: #9b3a22; }
      .rise { animation: rise .9s cubic-bezier(.22,.7,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
      .rule { stroke-dasharray: 620; animation: draw 1.4s .5s cubic-bezier(.22,.7,.2,1) both; }
      @keyframes draw { from { stroke-dashoffset: 620; } }
      .centering { stroke-dasharray: 3 5; animation: march 1.6s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -16; } }
      .stone { fill: #faf6ec; stroke: #1b1915; stroke-width: 1.4; stroke-linejoin: round;
               animation: lay 16s cubic-bezier(.22,.7,.2,1) infinite both; }
      @keyframes lay {
        0% { opacity: 0; transform: translateY(-16px); }
        3% { opacity: 1; transform: none; }
        84% { opacity: 1; transform: none; }
        88%, 100% { opacity: 0; transform: translateY(-16px); }
      }
      .hatch { animation: ink 16s infinite both; }
      @keyframes ink { 0%, 26% { opacity: 0; } 32%, 84% { opacity: 1; } 88%, 100% { opacity: 0; } }
      .key { fill: #9b3a22; stroke: #1b1915; stroke-width: 1.4; stroke-linejoin: round;
             animation: drop 16s cubic-bezier(.3,1.3,.5,1) infinite both; }
      @keyframes drop {
        0%, 25% { opacity: 0; transform: translateY(-70px); }
        27% { opacity: 1; transform: translateY(-70px); }
        31% { opacity: 1; transform: none; }
        84% { opacity: 1; transform: none; }
        88%, 100% { opacity: 0; transform: translateY(-70px); }
      }
      .fig { animation: ink 16s infinite both; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="1200" height="470" fill="#f3eee2"/>
  <rect width="1200" height="470" filter="url(#grain)"/>
  <rect x="14.5" y="14.5" width="1171" height="441" fill="none" stroke="#1b1915" stroke-width="1.5"/>
  <rect x="21.5" y="21.5" width="1157" height="427" fill="none" stroke="#1b1915" stroke-width=".6"/>

  <!-- Fig. 1: the arch -->
  <g fill="none" stroke="#1b1915" stroke-width="1.4">
