  <path class="stone" style="animation-delay:2.16s" d="M182.6 241.4L144.3 209.3A138 138 0 0 0 120.3 250.8L167.3 267.9A88 88 0 0 1 182.6 241.4Z"/>
  <path class="stone" style="animation-delay:2.48s" d="M317.4 241.4L355.7 209.3A138 138 0 0 0 319.0 178.5L294.0 221.8A88 88 0 0 1 317.4 241.4Z"/>
