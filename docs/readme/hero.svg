  <path class="hatch" fill="none" stroke="#1b1915" stroke-width=".6" d="M373.5 287.2L384.5 286.2M372.1 276.5L382.9 274.6M369.8 265.9L380.4 263.1M362.4 245.6L372.4 240.9M357.4 236.0L366.9 230.5M351.6 226.9L360.6 220.6M337.7 210.3L345.5 202.5M329.7 203.0L336.8 194.6M321.1 196.4L327.4 187.4M302.4 185.6L307.1 175.6M292.4 181.5L296.2 171.1M282.1 178.2L284.9 167.6M217.9 178.2L215.1 167.6M207.6 181.5L203.8 171.1M197.6 185.6L192.9 175.6M178.9 196.4L172.6 187.4M170.3 203.0L163.2 194.6M162.3 210.3L154.5 202.5M148.4 226.9L139.4 220.6M142.6 236.0L133.1 230.5M137.6 245.6L127.6 240.9M130.2 265.9L119.6 263.1M127.9 276.5L117.1 274.6M126.5 287.2L115.5 286.2"/>
  <path class="key" d="M263.9 219.2L276.4 148.3A152 152 0 0 0 223.6 148.3L236.1 219.2A80 80 0 0 1 263.9 219.2Z"/>
  <text class="serif fig" x="250" y="394" text-anchor="middle" font-size="14.5" font-style="italic" fill="#6a6558">Fig. 1. The keystone goes in last and locks the rest.</text>

  <!-- Title -->
  <g transform="translate(476 0)">
    <text class="label rise" x="2" y="138">FOR RESIDENTIAL CONTRACTORS</text>
    <text class="serif rise" style="animation-delay:.12s" x="-4" y="248" font-size="118" letter-spacing="19" fill="#1b1915">VORQ</text>
    <path class="rule" d="M2 280H622" stroke="#1b1915" stroke-width="1.2" fill="none"/>
    <text class="serif rise" style="animation-delay:.3s" x="0" y="330" font-size="35" fill="#1b1915">BOQ to final bill, on one record.</text>
    <text class="serif rise" style="animation-delay:.45s" x="1" y="368" font-size="17.5" font-style="italic" fill="#4a463d">Construction operations and billing, in the browser and on the phone.</text>
  </g>
</svg>
